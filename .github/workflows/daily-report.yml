name: daily-report

on:
  schedule:
    # Every morning, at about 08:23 in winter and 09:23 in summer (Berlin).
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shares the group with pr-sync, so the two never push to this repository at
# the same time.
concurrency:
  group: pr-sync
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write the report
        env:
          GH_TOKEN: ${{ secrets.PR_SYNC_TOKEN }}
          PR_AUTHOR: ${{ vars.PR_AUTHOR || 'moezdil' }}
        run: ./report.sh

      - name: Commit the report
        env:
          GIT_NAME: ${{ vars.GIT_NAME || 'mesutoezdil' }}
          GIT_EMAIL: ${{ vars.GIT_EMAIL || 'mesudozdil@gmail.com' }}
        run: |
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git add STATUS.md reports
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -q -s -m "Add pull request report for $(date +%F)"
          git pull -q --rebase
          git push -q
